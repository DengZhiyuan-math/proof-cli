[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathematical-proof-cli"
version = "0.1.0"
description = "CLI-first research proof OS"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[project.scripts]
proof = "proof_cli.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"proof_cli.webapp" = ["static/*"]
# the studio (ADR-0011, #68): its page, the vendored CodeMirror and PDF.js, and the licences
"proof_cli.studio" = ["static/*", "static/vendor/*", "LICENSE", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
