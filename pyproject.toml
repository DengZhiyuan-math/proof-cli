[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathematical-proof-cli"
version = "0.1.0"
description = "CLI-first research proof OS: the proof map, its project state and the agents' command surface"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[project.scripts]
proof = "proof_cli.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# The family's other packages live in packages/ (ADR-0018): proof-agents, latex-agent and proof-web.
# One `pytest` from here runs every package's tests from the checkout; each also runs alone from its folder.
[tool.pytest.ini_options]
testpaths = ["tests", "packages/proof-agents/tests", "packages/latex-agent/tests", "packages/proof-web/tests"]
pythonpath = ["src", "packages/proof-agents/src", "packages/latex-agent/src", "packages/proof-web/src"]
