[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathematical-proof-cli"
version = "0.1.0"
description = "CLI-first research proof OS: the proof map, its project state and the agents' command surface"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[project.scripts]
proof = "proof_cli.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# latex-agent, the studio taken from prism-local, lives in packages/ (ADR-0018); proof-agents and proof-web are
# repositories of their own in the zeqome organisation. One `pytest` from here runs the core's and latex-agent's tests.
[tool.pytest.ini_options]
testpaths = ["tests", "packages/latex-agent/tests"]
pythonpath = ["src", "packages/latex-agent/src"]
