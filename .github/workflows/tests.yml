name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  core-and-studio:
    # proof-cli and latex-agent, from this repository alone (proof-agents and proof-web are private siblings: the
    # tests that need them skip). Windows runs the project list's msvcrt lock branch (projects.py), which the
    # developers' Macs never do.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -U pip setuptools wheel
      - run: python -m pip install -e ".[dev]" -e packages/latex-agent
      - run: python -c "import click, typer, pydantic, rich, proof_cli.cli, latex_agent.server; print('imports ok')"
      - run: python -m pytest -q -x
